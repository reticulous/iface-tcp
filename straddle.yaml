# iface-tcp — RNS-over-TCP interface for reticulous.
#
# Outbound dial (via net's NET_PORT_TCP_DIAL) + inbound listen, HDLC
# byte-stuffing on the wire. Each connection registers as its own RNS
# interface with rnsd through RNSD_PORT_IFACE.
schema_version: 1
name: reticulous/iface-tcp
prefix: rns_tcp
version: 0.0.0
firmware: esp-idf
platforms: [idf]
requires:
  - reticulous/rns
  - spangap/spangap-net
# Boot-registered services (folded into the generated boot registration).
# TcpService::onInit self-registers with rnsd via ITS; `requires: reticulous/rns`
# puts rnsd ahead of it in dependency-topo order, so its port surface is up
# first. TcpLcdService adds the on-device Settings pane, when:-gated on
# spangap-lcd (a hand-written peers-list editor too rich for a settings: block).
services:
  - { class: TcpService, header: tcp.h }

# Declarative settings: both surfaces + storage defaults from one block. The
# outbound peers are a collection — tcp.cpp owns every mutation through the
# tcp.peer.* sentinels and validates there, so the array editor, the add dialog
# and the per-keystroke checks the old panel and pane each carried are gone.
settings:
  - at:
      - { id: mesh, label: "Mesh Network", short: "Mesh", order: 3 }
      - { id: interfaces, label: "RNS Interfaces", short: "Ifaces", order: 2 }
      - { id: tcp, label: "TCP", short: "TCP" }
    rows:
      - section: "Outgoing"
      - caption: "Dial public RNS TCP servers or other Reticulum nodes by host:port. Each peer registers as its own RNS interface."
      - list:
          label: "Peers"
          key: s.tcp.peers
          id: id
          item: "{host}:{port}"
          subtitle: "{mode}"
          # tcp.cpp publishes each peer's pill — the words and the colour a
          # connection state deserves are its judgement, not a UI's.
          status: "tcp.peer.{id}"
          empty: "No peers configured."
          orderable: true
          cmd: tcp.peer
          add:
            - label: "Add peer"
              form:
                title: "Add peer"
                submit: "Add"
                fields:
                  - text: { label: "Host", field: host }
                  - text: { label: "Port", field: port, default: "4965" }
          remove: { confirm: "Remove {host}:{port}?" }
          actions:
            - { label: "Connect", do: { set: { key: "tcp.peer.connect", value: "{id}" } } }
          edit:
            - switch:   { label: "Enabled", field: enable }
            - text:     { label: "Host", field: host }
            - text:     { label: "Port", field: port }
            - dropdown:
                label: "Mode"
                field: mode
                options:
                  - { v: "gateway",      l: "Gateway" }
                  - { v: "full",         l: "Full" }
                  - { v: "access_point", l: "Access point" }
                  - { v: "roaming",      l: "Roaming" }
                  - { v: "boundary",     l: "Boundary" }
            - section: "Access code"
            - caption: "IFAC: a network name + passphrase that must match this peer's, or traffic is dropped. Leave blank for an open interface."
            - text: { label: "IFAC network", field: ifac_netname }
            # Write-only: tcp.cpp routes it to an id-keyed secret store, never
            # into the peer object, and an empty submit leaves it unchanged.
            - text: { label: "IFAC passphrase", field: ifac_netkey, secret: true, placeholder: "unchanged if left empty" }
            - section: "Retry"
            - text: { label: "Min backoff (s)", field: retry_min, placeholder: "2" }
            - text: { label: "Max backoff (s)", field: retry_max, placeholder: "300" }
      - section: "Incoming"
      - caption: "Accept inbound TCP connections — other Reticulum nodes dial this device on the listen port. Each accepted connection becomes its own RNS interface."
      - switch: { label: "Enabled", key: "s.tcp.server_enable" }
      - text:   { label: "Listen port", key: "s.tcp.server_port" }
      - dropdown:
          label: "Mode"
          key: "s.tcp.server_mode"
          options:
            - { v: "full",         l: "Full" }
            - { v: "gateway",      l: "Gateway" }
            - { v: "access_point", l: "Access point" }
            - { v: "roaming",      l: "Roaming" }
            - { v: "boundary",     l: "Boundary" }
      - text: { label: "Max inbound", key: "s.tcp.max_inbound" }
      - section: "Access code"
      - caption: "IFAC for accepted connections: a network name + passphrase that dialing peers must match, or their traffic is dropped."
      - text: { label: "IFAC network", key: "s.tcp.server_ifac_netname" }
      - text: { label: "IFAC passphrase", key: "secrets.tcp.server_ifac_netkey", secret: true }
