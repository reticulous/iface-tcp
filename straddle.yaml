# iface-tcp — RNS-over-TCP interface for reticulous.
#
# Outbound dial (via net's NET_PORT_TCP_DIAL) + inbound listen, HDLC
# byte-stuffing on the wire. Each connection registers as its own RNS
# interface with rnsd through RNSD_PORT_IFACE.
schema_version: 1
name: reticulous/iface-tcp
prefix: rns_tcp
version: 0.0.0
firmware: esp-idf
platforms: [idf]
requires:
  - reticulous/rns
  - spangap/spangap-net
# Boot-registered services (folded into the generated boot registration).
# TcpService::onInit self-registers with rnsd via ITS; `requires: reticulous/rns`
# puts rnsd ahead of it in dependency-topo order, so its port surface is up
# first. TcpLcdService adds the on-device Settings pane, when:-gated on
# spangap-lcd (a hand-written peers-list editor too rich for a settings: block).
services:
  - { class: TcpService, header: tcp.h }

# Declarative settings: both surfaces + storage defaults from one block. The
# outbound peers are a collection — tcp.cpp owns every mutation through the
# tcp.peer.* sentinels and validates there, so the array editor, the add dialog
# and the per-keystroke checks the old panel and pane each carried are gone.
settings:
  - at:
      - { id: reticulum }
      - { id: interfaces }
    order: 3
    rows:
      - heading: "TCP"
      - section: "Outbound peers"
      - caption: "Dial public RNS TCP servers or other Reticulum nodes by host:port. Each peer registers as its own RNS interface."
      - list:
          key: s.tcp.peers
          id: id
          item: "{display}"
          subtitle: "{host}:{port}"
          # tcp.cpp publishes each peer's pill — the words and the colour a
          # connection state deserves are its judgement, not a UI's.
          status: "tcp.peer.{id}"
          empty: "No peers configured."
          reorder: true
          cmd: tcp.peer
          add:
            - label: "Add peer"
              form:
                title: "Add peer"
                submit: "Add"
                fields:
                  - text: { label: "Name", field: name, placeholder: "shown in the list; host:port if empty" }
                  - text: { label: "Host", field: host }
                  - integer: { label: "Port", field: port, min: 1, max: 65535, default: 4965 }
          remove: { confirm: "Remove {display}?" }
          actions:
            - { label: "Connect", do: { set: { key: "tcp.peer.connect", value: "{id}" } } }
          edit:
            - switch:   { label: "Enabled", field: enable }
            - text:     { label: "Name", field: name, placeholder: "shown in the list; host:port if empty" }
            - text:     { label: "Host", field: host }
            - integer:  { label: "Port", field: port, min: 1, max: 65535 }
            - advanced:
                rows:
                  - dropdown:
                      label: "Interface mode"
                      field: mode
                      options:
                        - { v: "access_point", l: "Access point" }
                        - { v: "gateway",      l: "Gateway" }
                        - { v: "full",         l: "Full" }
                        - { v: "roaming",      l: "Roaming" }
                        - { v: "boundary",     l: "Boundary" }
                  - integer: { label: "Community Radius", field: community_radius, min: 0, max: 7 }
                  - caption: "Nodes within this many hops via this peer are yours: their announces are kept and answered for, and searches run on their behalf. 0 (default) treats the peer as an uplink: on-demand only."
                  - integer: { label: "Min backoff", unit: "s", field: retry_min, min: 1, max: 3600 }
                  - integer: { label: "Max backoff", unit: "s", field: retry_max, min: 1, max: 86400 }
                  - section: "Interface access code (IFAC)"
                  - caption: "A network name + passphrase that must match this peer's, or traffic is dropped. Leave blank for an open interface."
                  - text: { label: "IFAC network", field: ifac_netname }
                  # An ordinary field of the peer, masked where it is shown:
                  # this is the code the other end was given, and an operator
                  # who cannot read back what they typed cannot tell why the
                  # link is silent.
                  - text: { label: "IFAC passphrase", field: ifac_netkey, secret: true }
      - section: "Incoming ports"
      - caption: "Accept inbound TCP connections — other Reticulum nodes dial this device on a listen port. Each accepted connection becomes its own RNS interface."
      - list:
          key: s.tcp.servers
          id: id
          item: "Port {port}"
          subtitle: "{mode}"
          empty: "No listen ports configured."
          reorder: true
          cmd: tcp.server
          add:
            - label: "Add port"
              form:
                title: "Add listen port"
                submit: "Add"
                fields:
                  - integer: { label: "Port", field: port, min: 1, max: 65535, default: 4965 }
          remove: { confirm: "Remove listener on port {port}?" }
          edit:
            - switch: { label: "Enabled", field: enable }
            - integer: { label: "Port", field: port, min: 1, max: 65535 }
            - advanced:
                rows:
                  - dropdown:
                      label: "Interface mode"
                      field: mode
                      options:
                        - { v: "access_point", l: "Access point" }
                        - { v: "gateway",      l: "Gateway" }
                        - { v: "full",         l: "Full" }
                        - { v: "roaming",      l: "Roaming" }
                        - { v: "boundary",     l: "Boundary" }
                  - integer: { label: "Max connections", field: max_conns, min: 0, max: 8 }
                  - integer: { label: "Community Radius", field: community_radius, min: 0, max: 7 }
                  - caption: "Nodes within this many hops via this port are yours: their announces are kept and answered for, and searches run on their behalf. 0 (default) treats callers as uplinks: on-demand only."
                  - section: "Interface access code (IFAC)"
                  - caption: "A network name + passphrase dialing peers must match, or their traffic is dropped. Leave blank for an open port."
                  - text: { label: "IFAC network", field: ifac_netname }
                  - text: { label: "IFAC passphrase", field: ifac_netkey, secret: true }
